# Whole stack for local development: `docker compose up --build`
# Open http://localhost:8080 (Caddy sends /api/* to FastAPI, the rest to Next.js).
# API health check: http://localhost:8080/api/health

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DIR: /data/storage
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
  NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
  SITE_URL: ${SITE_URL:-http://localhost:8080}
  INBOX_DIR: /data/inbox
  INBOX_SETTLE_SECONDS: ${INBOX_SETTLE_SECONDS:-60}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
  TIMEZONE: ${TIMEZONE:-Africa/Kigali}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    environment: *backend-env
    volumes:
      - storage:/data/storage
      # Shared folder with SAP exports, read-only (see INBOX_HOST_DIR in .env.example).
      - ${INBOX_HOST_DIR:-./local-data/inbox}:/data/inbox:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Picks up new files from the shared folder and starts scheduled runs.
  scheduler:
    build: ./backend
    command: ["python", "-m", "app.jobs.scheduler"]
    environment: *backend-env
    volumes:
      - storage:/data/storage
      - ${INBOX_HOST_DIR:-./local-data/inbox}:/data/inbox:ro
    depends_on:
      backend:
        condition: service_healthy

  # Development only: catches outgoing e-mail instead of sending it.
  # Start with COMPOSE_PROFILES=dev-mail and SMTP_HOST=mailpit (see .env.example);
  # read the messages at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev-mail"]
    ports:
      - "8025:8025"

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10

  # Nightly encrypted backups (database + stored files) with restic.
  # Start with COMPOSE_PROFILES=backup; see "Backups" in docs/operations.md.
  backup:
    build: ./backup
    profiles: ["backup"]
    environment:
      TZ: ${TIMEZONE:-Africa/Kigali}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - storage:/data/storage
      # Used when RESTIC_REPOSITORY is a folder (/backups); keep a copy off the server.
      - ${BACKUP_LOCAL_DIR:-./local-data/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  storage:
