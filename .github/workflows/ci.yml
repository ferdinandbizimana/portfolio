name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: No data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_data_files.py

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Full stack and browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Create .env and admin password for CI
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          # Contact form mail goes to the Mailpit catcher, checked by the browser tests.
          sed -i -e "s/^SMTP_HOST=.*/SMTP_HOST=mailpit/" -e "s/^SMTP_PORT=.*/SMTP_PORT=1025/" \
            -e "s/^SMTP_SECURITY=.*/SMTP_SECURITY=none/" \
            -e "s/^MAIL_FROM=.*/MAIL_FROM=portfolio@example.com/" \
            -e "s/^CONTACT_TO_EMAIL=.*/CONTACT_TO_EMAIL=owner@example.com/" .env
          echo "COMPOSE_PROFILES=dev-mail" >> .env
          echo "E2E_PASSWORD=ci-admin-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Shared folder for the folder pickup tests
        run: mkdir -p local-data/inbox
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API health check through Caddy
        run: curl --fail --silent --show-error http://localhost:8080/api/health
      - name: Worker runs a job
        run: docker compose exec -T backend python -m app.jobs.smoke
      - name: Create the admin account
        run: >-
          docker compose exec -T -e ADMIN_PASSWORD="$E2E_PASSWORD" backend
          python -m app.cli create-admin --email "$E2E_EMAIL"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser tests (desktop and mobile)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
