name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: No data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_data_files.py

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Docker Compose stack starts and is healthy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API health check
        run: curl --fail --silent --show-error http://localhost:8000/api/health
      - name: Frontend shows API status
        run: |
          curl --fail --silent --show-error http://localhost:3000 | grep -q 'API: <strong>ok</strong>'
      - name: Worker runs a job
        run: docker compose exec -T backend python -m app.jobs.smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
