[project]
name = "portfolio-backend"
version = "0.1.0"
description = "API, analysis engine and background jobs for Ferdinand Bizimana's portfolio and SAP analytics application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "rq>=2.0,<3",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.20,<1",
    "pandas>=2.2,<3",
    "pyarrow>=18,<22",
    "python-calamine>=0.3,<1",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "docxtpl>=0.19,<1",
    "python-pptx>=1.0,<2",
    "docxcompose>=1.4,<2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "fakeredis>=2.26,<3",
    "pandas-stubs>=2.2,<3",
    "types-openpyxl>=3.1,<4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against report labels that use en dashes (as in the RMS reports).
"tests/**" = ["S101", "S105", "S106", "RUF001"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["docxtpl", "docxtpl.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Third-party notice, not about our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
